<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OsFight - Giriş</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="girisEkrani">
        <div class="giris-kutusu">
            <h1>⚔️ OsFight Online ⚔️</h1>
            <p>İsmini yaz ve dünyaya katıl:</p>
            <input type="text" id="isimInput" placeholder="Kullanıcı adı..." maxlength="15">
            <button onclick="girisYap()">Katıl</button>
            <p class="uyari">💾Geçmişi Silersen Arkadaş ve İsmin Gider!💾</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function girisYap() {
            const username = document.getElementById('isimInput').value.trim();
            if (!username) return alert('İsim girmelisin!');
            localStorage.setItem('osfight_isim', username);
            socket.emit('login', username);
        }

        socket.on('login_success', (data) => {
            window.location.href = 'game.html';
        });
    </script>
</body>
</html>
