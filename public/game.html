<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OsFight - Savaş</title>
    <!-- Socket.io istemcisi (sunucudan otomatik gelir) -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0d0d1a; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; }
        #warningTopRight { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.75); padding: 10px 16px; border-radius: 10px; border: 1px solid #f5c842; color: #f5c842; font-size: 13px; z-index: 10; backdrop-filter: blur(4px); user-select: none; pointer-events: none; }
        #bottomPanel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; background: rgba(0,0,0,0.7); padding: 16px 24px; border-radius: 60px; backdrop-filter: blur(8px); border: 1px solid #333; z-index: 10; flex-wrap: wrap; justify-content: center; }
        #bottomPanel button { padding: 10px 22px; border: none; border-radius: 40px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
        .char-btn { background: #2a2a4a; color: #fff; border: 2px solid transparent !important; }
        .char-btn:hover { transform: scale(1.08); border-color: #fff !important; }
        #startGame { background: #e94560; color: #fff; padding: 10px 34px; }
        #startGame:hover { background: #ff6b81; transform: scale(1.05); box-shadow: 0 0 30px #e94560aa; }
        #rightPanel { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 14px; z-index: 10; }
        #rightPanel button { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); border: 1px solid #444; color: #fff; padding: 12px 20px; border-radius: 40px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; min-width: 140px; text-align: center; }
        #rightPanel button:hover { background: #e94560; border-color: #e94560; transform: scale(1.05); }
        #chatBox { display: none; position: absolute; bottom: 120px; right: 30px; width: 280px; max-height: 340px; background: #1a1a2e; border: 1px solid #555; border-radius: 16px; padding: 16px; z-index: 20; backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.8); flex-direction: column; }
        #chatBox .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: #e94560; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 8px; }
        #chatBox .header span { cursor: pointer; color: #aaa; }
        #chatBox .header span:hover { color: #fff; }
        #messages { flex: 1; max-height: 200px; overflow-y: auto; margin-bottom: 10px; font-size: 14px; color: #ddd; display: flex; flex-direction: column; gap: 4px; }
        #messages p { background: #0d0d1a; padding: 6px 10px; border-radius: 8px; margin: 0; word-break: break-word; }
        #messages .system { color: #f5c842; font-style: italic; text-align: center; }
        #chatInput { padding: 8px 12px; border-radius: 20px; border: 1px solid #444; background: #0d0d1a; color: #fff; outline: none; margin-bottom: 8px; }
        #sendMsg { background: #e94560; color: #fff; border: none; padding: 8px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        #sendMsg:hover { background: #ff6b81; }
        #playerList { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 12px 18px; border-radius: 12px; border: 1px solid #333; z-index: 10; font-size: 13px; max-height: 200px; overflow-y: auto; min-width: 120px; }
        #playerList h4 { color: #e94560; margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        #playerList div { padding: 2px 0; color: #aaa; }
        canvas { display: block; }
        @media (max-width: 700px) {
            #bottomPanel { bottom: 15px; padding: 12px; gap: 8px; border-radius: 30px; width: 95%; }
            #bottomPanel button { padding: 6px 14px; font-size: 12px; }
            #rightPanel { right: 10px; gap: 8px; }
            #rightPanel button { padding: 8px 12px; font-size: 12px; min-width: 80px; }
            #warningTopRight { font-size: 10px; padding: 6px 10px; top: 10px; right: 10px; }
            #chatBox { width: 220px; right: 10px; bottom: 100px; }
            #playerList { top: 60px; left: 10px; font-size: 11px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div id="warningTopRight">💾 Geçmişi Silersen Arkadaş ve İsmin Gider! 💾</div>
    <div id="playerList"><h4>👥 Savaşçılar</h4><div id="onlinePlayers">Yükleniyor...</div></div>

    <div id="bottomPanel">
        <button class="char-btn" id="char1" style="background:#e94560;">⚔️ Kılıç</button>
        <button class="char-btn" id="char2" style="background:#1e90ff;">🏹 Okçu</button>
        <button class="char-btn" id="char3" style="background:#32cd32;">🧙 Büyücü</button>
        <button id="startGame">🔥 SAVAŞ</button>
    </div>

    <div id="rightPanel">
        <button id="addFriend">👥 Arkadaş Ekle</button>
        <button id="chatFriend">💬 Arkadaş ile Konuş</button>
    </div>

    <div id="chatBox">
        <div class="header"><span>💬 Dünya Sohbeti</span><span id="closeChat" style="cursor:pointer;">✕</span></div>
        <div id="messages"></div>
        <input type="text" id="chatInput" placeholder="Mesajını yaz..." />
        <button id="sendMsg">Gönder</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        // ---- SOCKET.IO BAĞLANTISI ----
        const socket = io(); // Sunucuya bağlanır

        // ---- THREE.JS SAHNE ----
        import * as THREE from 'three';
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d1a);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 6);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.prepend(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xffaa88, 0.4);
        fillLight.position.set(-3, 2, 4);
        scene.add(fillLight);

        const groundGeo = new THREE.PlaneGeometry(12, 12);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.7, metalness: 0.1, side: THREE.DoubleSide });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);
        const gridHelper = new THREE.GridHelper(10, 20, 0xe94560, 0x333366);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // Yerel oyuncu
        const player = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xe94560, emissive: 0x330000, roughness: 0.3, metalness: 0.6 })
        );
        player.position.set(0, 0.4, 0);
        player.castShadow = true;
        scene.add(player);

        // Diğer oyuncuları tutmak için
        const otherPlayers = {};

        // ---- OYUNCU İSMİNİ AL ve SUNUCUYA BİLDİR ----
        const playerName = localStorage.getItem('playerName') || 'Savaşçı';
        socket.emit('player-join', playerName);
        console.log(`⚔️ ${playerName} bağlandı`);

        // ---- SOCKET OLAYLARI ----
        // Güncel oyuncu listesini al
        socket.on('update-players', (players) => {
            const listDiv = document.getElementById('onlinePlayers');
            listDiv.innerHTML = '';
            players.forEach(p => {
                const div = document.createElement('div');
                div.textContent = p.name + (p.id === socket.id ? ' (Sen)' : '');
                listDiv.appendChild(div);
            });
            // Diğer oyuncuları sahneye ekle/kaldır (basitçe küp göster)
            // Mevcut olmayanları sil
            const currentIds = players.map(p => p.id);
            Object.keys(otherPlayers).forEach(id => {
                if (!currentIds.includes(id)) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }
            });
            // Yenileri ekle
            players.forEach(p => {
                if (p.id !== socket.id && !otherPlayers[p.id]) {
                    const mesh = new THREE.Mesh(
                        new THREE.BoxGeometry(0.6, 0.6, 0.6),
                        new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x002244 })
                    );
                    mesh.position.set(Math.random() * 3 - 1.5, 0.3, Math.random() * 3 - 1.5);
                    scene.add(mesh);
                    otherPlayers[p.id] = mesh;
                }
            });
        });

        // Sistem mesajları (katılma/ayrılma)
        socket.on('system-message', (msg) => {
            const div = document.getElementById('messages');
            const p = document.createElement('p');
            p.className = 'system';
            p.textContent = `📢 ${msg}`;
            div.appendChild(p);
            div.scrollTop = div.scrollHeight;
        });

        // Sohbet mesajı gelince
        socket.on('chat-message', (data) => {
            const div = document.getElementById('messages');
            const p = document.createElement('p');
            p.innerHTML = `<strong>${data.name}</strong>: ${data.message}`;
            div.appendChild(p);
            div.scrollTop = div.scrollHeight;
        });

        // Savaş aksiyonu gelince (örnek: herkese bildirim)
        socket.on('battle-action', (action) => {
            // Burada oyuncu pozisyonu veya saldırı animasyonu tetiklenebilir
            alert(`⚡ ${action.playerName} saldırıyor! (${action.type})`);
            // Örnek: herkesin küpünü kırmızı yapıp eski haline getir
            Object.values(otherPlayers).forEach(mesh => {
                mesh.material.color.setHex(0xff0000);
                setTimeout(() => mesh.material.color.setHex(0x44aaff), 500);
            });
        });

        // ---- UI İŞLEMLERİ ----
        // Karakter seç
        document.getElementById('char1').onclick = () => { player.material.color.setHex(0xe94560); };
        document.getElementById('char2').onclick = () => { player.material.color.setHex(0x1e90ff); };
        document.getElementById('char3').onclick = () => { player.material.color.setHex(0x32cd32); };

        // Savaş butonu - herkese saldırı sinyali gönder
        document.getElementById('startGame').onclick = () => {
            const action = { type: 'attack', playerName: playerName };
            socket.emit('battle-action', action);
            alert('⚔️ Savaş çağrısı gönderildi!');
        };

        // Arkadaş Ekle (yerel)
        document.getElementById('addFriend').onclick = () => {
            const friend = prompt('Arkadaşının adını yaz:');
            if (friend && friend.trim() !== '') {
                let friends = JSON.parse(localStorage.getItem('friends') || '[]');
                if (!friends.includes(friend.trim())) {
                    friends.push(friend.trim());
                    localStorage.setItem('friends', JSON.stringify(friends));
                    alert(`✅ ${friend.trim()} eklendi!`);
                } else { alert('Zaten var.'); }
            }
        };

        // Sohbet kutusu
        const chatBox = document.getElementById('chatBox');
        document.getElementById('chatFriend').onclick = () => {
            chatBox.style.display = chatBox.style.display === 'flex' ? 'none' : 'flex';
            if (chatBox.style.display === 'flex') document.getElementById('chatInput').focus();
        };
        document.getElementById('closeChat').onclick = () => chatBox.style.display = 'none';

        // Mesaj gönderme (sunucuya)
        const sendMessage = () => {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg === '') return;
            // Sunucuya gönder
            socket.emit('chat-message', { name: playerName, message: msg });
            // Kendi mesajını direkt ekrana ekle (istemci taraflı optimizasyon)
            const div = document.getElementById('messages');
            const p = document.createElement('p');
            p.innerHTML = `<strong style="color:#e94560;">${playerName}</strong>: ${msg}`;
            div.appendChild(p);
            div.scrollTop = div.scrollHeight;
            input.value = '';
        };
        document.getElementById('sendMsg').onclick = sendMessage;
        document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Sağ üst uyarıya çift tıklayınca geçmişi sil
        document.getElementById('warningTopRight').addEventListener('dblclick', () => {
            if (confirm('Geçmiş silinsin mi?')) {
                localStorage.removeItem('playerName');
                localStorage.removeItem('friends');
                alert('Temizlendi! Sayfa yenilenecek.');
                location.reload();
            }
        });

        // ---- ANİMASYON DÖNGÜSÜ ----
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
